[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyweaver"
version = "0.3.0"
description = "Dataverse-authorized reader projections and governed OneLake publication"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "azure-identity>=1.19,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
adapter = ["deltalake>=1.6,<2", "pyarrow>=23,<24", "azure-storage-blob>=12.30,<13", "tzdata>=2025.2,<2027"]
qualification = ["pyodbc>=5.2,<6"]

[project.scripts]
policyweaver = "policyweaver.cli:main"
policyweaver-adapter = "policyweaver.adapter_cli:main"
policyweaver-onboard = "policyweaver.onboarding:main"

[tool.setuptools.packages.find]
include = ["policyweaver*"]

[tool.setuptools.package-data]
policyweaver = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
