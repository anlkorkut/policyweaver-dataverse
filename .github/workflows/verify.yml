name: Verify Policy Weaver
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-security-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements.lock -e '.[adapter,test]'
      - run: python -m pytest -q --junitxml=reports/tests.xml
      - run: python -m pip check
      - name: Verify clean client distribution
        run: python scripts/build_release.py --output-directory dist/ci-release --source-directory dist/ci-client-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: reports/tests.xml
          retention-days: 14
